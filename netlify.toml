# Netlify – frontend SushiMaster TV
# https://docs.netlify.com/configure-builds/file-based-configuration

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "build"

# Setează în Netlify UI: REACT_APP_BACKEND_URL = https://xxx.onrender.com

[build.environment]
  NODE_VERSION = "20"
  DISABLE_ESLINT_PLUGIN = "true"

# Proxy Supabase Storage through Netlify CDN to reduce Supabase egress (5GB free → 100GB Netlify free)
# Media requests go: TV → Netlify CDN (cached) → Supabase Storage (only on cache miss)
[[redirects]]
  from = "/supabase-media/*"
  to   = "https://isdzbwxjtfrykyoeevmy.supabase.co/storage/v1/object/public/content/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio bucket proxy
[[redirects]]
  from = "/supabase-audio/*"
  to   = "https://isdzbwxjtfrykyoeevmy.supabase.co/storage/v1/object/public/audio/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA: toate rutele -> index.html
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
