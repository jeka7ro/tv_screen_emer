# Netlify – frontend SushiMaster TV
# https://docs.netlify.com/configure-builds/file-based-configuration

[build]
  base    = "frontend"
  command = "TZ='Europe/Bucharest' REACT_APP_BUILD_DATE=$(date '+%d.%m.%Y %H:%M') npm run build"
  publish = "build"

# Setează în Netlify UI: REACT_APP_BACKEND_URL = https://xxx.onrender.com

[build.environment]
  NODE_VERSION = "20"
  DISABLE_ESLINT_PLUGIN = "true"

# Proxy media through Netlify CDN → Cloudflare R2 (zero egress)
# Media requests go: TV → Netlify CDN (cached) → R2 (zero egress)
[[redirects]]
  from = "/supabase-media/*"
  to   = "https://pub-cd1de53230f443a194fe03b7d619b451.r2.dev/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio bucket proxy → R2
[[redirects]]
  from = "/supabase-audio/*"
  to   = "https://pub-cd1de53230f443a194fe03b7d619b451.r2.dev/audio/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA: toate rutele -> index.html
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# CRITICAL: Force NO CACHE on HTML pages — prevents LG TV browser from serving stale/broken versions
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/display/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
