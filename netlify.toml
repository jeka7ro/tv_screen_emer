# Netlify – frontend SushiMaster TV
# https://docs.netlify.com/configure-builds/file-based-configuration

[build]
  base    = "frontend"
  command = "TZ='Europe/Bucharest' REACT_APP_BUILD_DATE=$(date '+%d.%m.%Y %H:%M') npm run build"
  publish = "build"

# Setează în Netlify UI: REACT_APP_BACKEND_URL = https://xxx.onrender.com

[build.environment]
  NODE_VERSION = "20"
  DISABLE_ESLINT_PLUGIN = "true"

# Proxy media through Netlify CDN → Cloudflare R2 (zero egress)
# Media requests go: TV → Netlify CDN (cached) → R2 (zero egress)
[[redirects]]
  from = "/supabase-media/*"
  to   = "https://pub-cd1de53230f443a194fe03b7d619b451.r2.dev/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio bucket proxy → R2
[[redirects]]
  from = "/supabase-audio/*"
  to   = "https://pub-cd1de53230f443a194fe03b7d619b451.r2.dev/audio/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve static media assets directly — MUST be before the catch-all SPA redirect!
# Without these, keepalive.mp4 gets served as index.html and the LG anti-standby video fails silently.
[[redirects]]
  from = "/keepalive.mp4"
  to = "/keepalive.mp4"
  status = 200
[[redirects]]
  from = "/black.mp4"
  to = "/black.mp4"
  status = 200
[[redirects]]
  from = "/blank.mp4"
  to = "/blank.mp4"
  status = 200

# Standalone TV display page (no React, works on any TV browser)
[[redirects]]
  from = "/tv/*"
  to = "/tv.html"
  status = 200

[[redirects]]
  from = "/display/*"
  to = "/tv.html"
  status = 200

# No-cache headers for TV pages — LG TVs must always get the latest version
[[headers]]
  for = "/display/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tv/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tv.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# SPA: toate rutele -> index.html (NO CACHE — critical for LG TV browsers)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
  [redirects.headers]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
