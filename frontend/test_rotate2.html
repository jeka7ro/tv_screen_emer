<!DOCTYPE html>
<html>
<head>
<style>
.dashboard-card {
  width: 200px;
  background: #333;
  padding: 10px;
  margin: 50px auto;
}
.vertical-container {
  /* Dashboard card is vertical */
  position: relative;
  background: black;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 auto;
  aspect-ratio: 9/16;
  width: 56.25%; /* 112.5px wide, 200px tall */
}
.iframe-wrapper {
  /* The iframe is 1920x1080 Landscape */
  width: 1920px;
  height: 1080px;
  position: absolute;
  top: 0; left: 0;
  transform-origin: top left;
  /* Rotated 90 degrees left (or right) then scaled */
  /* Wait. Rotate(90deg) puts it at X=0, Y=1920 to X=-1080, Y=1920. We need to shift it back */
  /* transform: rotate(90deg) translateY(-100%); */
  background: blue;
}
.iframe-wrapper.rot90 {
  transform: scale(0.104166) translateX(1080px) rotate(90deg);
}
</style>
</head>
<body>
  <div class="dashboard-card">
    <div class="vertical-container">
       <div class="iframe-wrapper rot90">
         <div style="color:white; font-size:100px;">1920x1080</div>
       </div>
    </div>
  </div>
</body>
</html>
