<!DOCTYPE html>
<html>
<head>
<style>
.container {
  width: 200px;
  background: #333;
  padding: 10px;
}
.vertical-preview {
  position: relative;
  background: black;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 auto;
  aspect-ratio: 9/16;
  width: 56.25%;
}
.iframe-content {
  position: absolute;
  top: 0;
  left: 0;
  border: 0;
  /* if iframe is 1080x1920, the scale needs to match the container width/1080 */
}
</style>
</head>
<body>
  <div class="container">
    <div class="vertical-preview">
       <div style="background: red; width: 1080px; height: 1920px; transform: scale(0.1); transform-origin: top left;">CONTENT</div>
    </div>
  </div>
</body>
</html>
