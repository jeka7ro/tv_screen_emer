<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afișaj Live Demo - GetApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    .display-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .content-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* STEAM EFFECT CLONED FROM APP */
    .steam {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }
    .steam-particle {
      position: absolute;
      bottom: 0%;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(20px);
      animation: steam-rise 6s ease-out infinite;
      opacity: 0;
    }
    .steam-particle:nth-child(1) { left: 48%; animation-delay: 0s; animation-duration: 7s; }
    .steam-particle:nth-child(2) { left: 50%; animation-delay: 0.5s; animation-duration: 5.5s; }
    .steam-particle:nth-child(3) { left: 52%; animation-delay: 1.2s; animation-duration: 8s; }
    .steam-particle:nth-child(4) { left: 49%; animation-delay: 1.8s; animation-duration: 6.5s; }
    .steam-particle:nth-child(5) { left: 51%; animation-delay: 2.5s; animation-duration: 7.5s; }
    .steam-particle:nth-child(6) { left: 47%; animation-delay: 0.3s; animation-duration: 6s; }
    .steam-particle:nth-child(7) { left: 53%; animation-delay: 1s; animation-duration: 5s; }
    .steam-particle:nth-child(8) { left: 48.5%; animation-delay: 2s; animation-duration: 9s; }
    .steam-particle:nth-child(9) { left: 51.5%; animation-delay: 2.8s; animation-duration: 7s; }
    .steam-particle:nth-child(10) { left: 50%; animation-delay: 3.5s; animation-duration: 6.5s; }
    .steam-particle:nth-child(11) { left: 49.5%; animation-delay: 0.7s; animation-duration: 5.8s; }
    .steam-particle:nth-child(12) { left: 50.5%; animation-delay: 1.5s; animation-duration: 7.2s; }
    @keyframes steam-rise {
      0% { bottom: -5%; opacity: 0; transform: scale(0.3) translateX(0); }
      15% { opacity: 0.6; }
      50% { opacity: 0.3; transform: scale(1.4) translateX(15px); }
      100% { bottom: 110%; opacity: 0; transform: scale(3) translateX(-30px); }
    }

    /* SAKURA EFFECT CLONED FROM APP */
    .sakura-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 30;
    }
    .sakura-petal {
      position: absolute;
      top: -10%;
      width: 18px;
      height: 22px;
      background: linear-gradient(145deg, #ffc0cb 0%, #ffb6c1 25%, #ffa0b5 50%, #ff91a4 75%, #ffb6c1 100%);
      border-radius: 50% 0 50% 50%;
      opacity: 0.8;
      filter: drop-shadow(0 1px 3px rgba(255, 105, 180, 0.25));
      animation: sakura-fall 10s linear infinite, sakura-sway 4s ease-in-out infinite, sakura-spin 8s linear infinite;
    }
    .sakura-petal:nth-child(n) { left: 10%; animation-delay: 0s, 0s, 0s; animation-duration: 9s, 3s, 7s; }
    .sakura-petal:nth-child(2n) { left: 25%; animation-delay: 1s, 0.5s, 0.3s; animation-duration: 10s, 3.5s, 8s; }
    .sakura-petal:nth-child(3n) { left: 45%; animation-delay: 2s, 1s, 0.7s; animation-duration: 8.5s, 2.8s, 9s; }
    .sakura-petal:nth-child(4n) { left: 65%; animation-delay: 0.5s, 1.5s, 1s; animation-duration: 11s, 3.2s, 7.5s; }
    .sakura-petal:nth-child(5n) { left: 85%; animation-delay: 1.5s, 0.3s, 1.5s; animation-duration: 9.5s, 2.9s, 8.5s; }
    .sakura-petal:nth-child(6n) { left: 5%; animation-delay: 2.5s, 0.8s, 0.2s; animation-duration: 10.5s, 3.3s, 6.5s; }
    .sakura-petal:nth-child(7n) { left: 35%; animation-delay: 0.8s, 1.2s, 1.8s; animation-duration: 8.8s, 3.1s, 9.5s; }
    .sakura-petal:nth-child(8n) { left: 55%; animation-delay: 1.8s, 0.6s, 0.5s; animation-duration: 11.5s, 2.7s, 7.2s; }
    .sakura-petal:nth-child(9n) { left: 75%; animation-delay: 2.8s, 1.4s, 1.2s; animation-duration: 9.2s, 3.4s, 8.2s; }
    .sakura-petal:nth-child(10n) { left: 95%; animation-delay: 0.3s, 0.2s, 0.8s; animation-duration: 10.2s, 3s, 6.8s; }
    
    @keyframes sakura-fall { 0% { top: -10%; opacity: 0; } 10% { opacity: 0.85; } 90% { opacity: 0.6; } 100% { top: 110%; opacity: 0; } }
    @keyframes sakura-sway { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(20px); } 75% { transform: translateX(-15px); } }
    @keyframes sakura-spin { 0% { transform: rotate(0deg) rotateY(0deg); } 25% { transform: rotate(90deg) rotateY(45deg); } 50% { transform: rotate(180deg) rotateY(0deg); } 75% { transform: rotate(270deg) rotateY(-45deg); } 100% { transform: rotate(360deg) rotateY(0deg); } }

    /* HEARTS EFFECT CLONED FROM APP */
    .heart-fall { animation: fall linear infinite; position: absolute; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

  </script>
</head>
<body>

  <!-- LAYER 1: The Screen Display (Valid Session) -->
  <div id="tvContainer" class="display-fullscreen hidden">
    <!-- Image Content -->
    <img id="bgImage" class="content-img" src="" alt="Demo Background">
    
    <!-- Timer UI Overlay for the demo -->
    <div class="absolute bottom-4 left-4 z-50 p-4 bg-black/80 backdrop-blur-md rounded-2xl border border-rose-500/50 shadow-2xl flex flex-col items-center">
      <div class="text-[10px] uppercase font-bold text-rose-400 tracking-widest mb-1">Demo Expiră în</div>
      <div id="countdownTimer" class="text-3xl font-black text-white tabular-nums tracking-widest">05:00</div>
    </div>

    <div class="absolute top-6 right-6 z-50 pointer-events-none">
      <img src="./getapp_smart_displays_white.png" class="h-12 drop-shadow-lg opacity-80" alt="Get App">
    </div>

    <!-- Effect Layers -->
    <div id="effectSteam" class="steam hidden">
      <div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div>
      <div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div>
      <div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div>
      <div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div>
    </div>

    <div id="effectSakura" class="sakura-container hidden">
      <!-- 25 petals simulating intensity-high -->
      <div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div>
      <div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div>
      <div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div><div class="sakura-petal"></div>
    </div>

    <div id="effectHearts" class="fixed inset-0 pointer-events-none z-40 overflow-hidden hidden"></div>
  </div>

  <!-- LAYER 2: Expired State (Refuses to render) -->
  <div id="expiredContainer" class="display-fullscreen hidden flex-col items-center justify-center p-6 bg-slate-950 text-center">
    <div class="max-w-xl mx-auto backdrop-blur-3xl bg-slate-900/80 border border-slate-700 p-12 rounded-[3rem] shadow-2xl relative">
      <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-rose-500 text-white rounded-full p-4 shadow-xl shadow-rose-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-4xl font-black text-white mt-4 mb-4">Timpul Demo a Expirat</h1>
      <p class="text-slate-400 text-lg mb-8 leading-relaxed">
        Sistemul real rulează nelimitat 24/7 pe Smart TV-urile locației tale, fără pauze.<br><br>
        Te-ai convins cât de bine arată? Activează-ți contul complet pentru platformă!
      </p>
      <a href="./prezentare.html" class="inline-block bg-[#00ced1] hover:bg-[#20b2aa] text-slate-900 font-black text-xl px-8 py-4 rounded-xl shadow-[0_0_20px_rgba(0,206,209,0.3)] hover:shadow-[0_0_40px_rgba(0,206,209,0.5)] transition-all">
        Contactează-ne acum
      </a>
    </div>
  </div>

  <script>
    function renderHearts() {
      const container = document.getElementById('effectHearts');
      container.classList.remove('hidden');
      for(let i=0; i<20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-fall';
        heart.innerText = '❤️';
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.top = '-50px';
        heart.style.fontSize = `${15 + Math.random() * 20}px`;
        heart.style.animationDuration = `${5 + Math.random() * 5}s`;
        heart.style.animationDelay = `${Math.random() * 2}s`;
        heart.style.opacity = 0.3 + Math.random() * 0.4;
        heart.style.transform = `rotate(${Math.random() * 360}deg)`;
        container.appendChild(heart);
      }
    }

    function initDisplay() {
      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('d');
      const tvContainer = document.getElementById('tvContainer');
      const expiredContainer = document.getElementById('expiredContainer');

      if (!dataParam) {
        expiredContainer.innerHTML = '<h1 class="text-white text-3xl font-bold">Eroare: Link Invalid</h1><p class="text-slate-400">Lipsete parametrul "d".</p>';
        expiredContainer.classList.remove('hidden');
        return;
      }

      try {
        const payload = JSON.parse(atob(dataParam));
        const expiresAt = payload.exp;
        
        // Timer Logic
        setInterval(() => {
          const now = Date.now();
          const remaining = Math.floor((expiresAt - now) / 1000);
          
          if (remaining <= 0) {
            // EXPIRED STATE
            tvContainer.classList.add('hidden');
            expiredContainer.classList.remove('hidden');
            expiredContainer.classList.add('flex');
          } else {
            // RUNNING STATE
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            document.getElementById('countdownTimer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
          }
        }, 1000);

        // Immediate first check
        if (Date.now() > expiresAt) {
          tvContainer.classList.add('hidden');
          expiredContainer.classList.remove('hidden');
          expiredContainer.classList.add('flex');
          return;
        }

        // Apply Image
        document.getElementById('bgImage').src = payload.img;

        // Apply Effects
        if (payload.eff === 'steam') {
          document.getElementById('effectSteam').classList.remove('hidden');
        } else if (payload.eff === 'sakura') {
          document.getElementById('effectSakura').classList.remove('hidden');
        } else if (payload.eff === 'hearts') {
          renderHearts();
        }

        // Show TV Container
        tvContainer.classList.remove('hidden');

      } catch(e) {
        expiredContainer.innerHTML = '<h1 class="text-white text-3xl font-bold">Eroare Decriptare</h1><p class="text-slate-400">Link-ul este corupt sau modificat greșit.</p>';
        expiredContainer.classList.remove('hidden');
        expiredContainer.classList.add('flex');
      }
    }

    initDisplay();
  </script>
</body>
</html>
