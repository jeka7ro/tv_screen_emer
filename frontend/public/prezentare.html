<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Smart Displays – Digital Signage Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'Inter',sans-serif;background:#f0f2f8}
  
  /* ── PRINT ── */
  @media print{
    body{background:white}
    .no-print{display:none!important}
    .page{page-break-after:always;box-shadow:none!important;border-radius:0!important;margin:0!important}
    .page:last-child{page-break-after:avoid}
  }
  @page{size:A4 landscape;margin:0}

  /* ── CONTROLS ── */
  .controls{position:fixed;top:20px;right:20px;z-index:999;display:flex;gap:10px;flex-direction:column}
  .controls button{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;transition:all .2s;display:flex;align-items:center;gap:8px}
  .btn-print{background:#7834FF;color:white}
  .btn-lang{background:white;color:#7834FF;border:2px solid #7834FF}
  .controls button:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,.2)}
  
  /* ── PAGE BASE ── */
  .page{width:297mm;min-height:210mm;margin:20px auto;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.15);border-radius:12px;display:flex;flex-direction:column}

  /* ── PAGE 1: COVER ── */
  .cover{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;justify-content:center;align-items:center;text-align:center;padding:50px}
  .cover-logo{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:40px}
  .cover-logo svg{display:none}
  .cover-logo img.logo-icon{width:70px;height:70px;border-radius:16px;box-shadow:0 8px 24px rgba(120,52,255,.5)}
  .cover-logo-text{text-align:left}
  .cover-logo-text .app{font-size:42px;font-weight:900;color:#ffffff;line-height:1;text-shadow:0 0 30px rgba(120,52,255,0.8)}
  .cover-logo-text .smart{background:#1a1a1a;color:white;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:1px}
  .cover h1{font-size:48px;font-weight:900;line-height:1.1;margin-bottom:20px}
  .cover h1 span{background:linear-gradient(90deg,#7834FF,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .cover p{font-size:19px;color:rgba(255,255,255,.75);max-width:600px;margin:0 auto 40px}
  .cover-badges{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:10px 24px;border-radius:50px;font-size:14px;font-weight:600;backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}
  .badge svg{opacity:.85}
  .cover-img-row{display:flex;gap:20px;margin-top:40px;justify-content:center}
  .cover-img-row img{height:130px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);object-fit:cover}
  .cover-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);font-size:12px}

  /* ── PAGE 2: FEATURE SPLIT ── */
  .split{flex-direction:row;background:white}
  .split-text{flex:1;padding:50px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#7834FF,#4f1d9c);color:white}
  .split-text .section-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.7;margin-bottom:12px}
  .split-text h2{font-size:36px;font-weight:900;line-height:1.15;margin-bottom:20px}
  .split-text p{font-size:15px;opacity:.85;line-height:1.7;margin-bottom:14px}
  .split-img{flex:1.2;position:relative;overflow:hidden}
  .split-img img{width:100%;height:100%;object-fit:cover}
  .split-img-right{order:1}
  .split-text-right{order:2;background:linear-gradient(135deg,#f97316,#dc2626)!important}
  .feature-list{list-style:none;margin-top:16px}
  .feature-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px;font-weight:500}
  .feature-list li::before{content:"✓";background:rgba(255,255,255,.2);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}

  /* ── PAGE 3: FULL DARK ── */
  .dark-feat{background:linear-gradient(135deg,#0f0c29,#1a1040);color:white;padding:50px}
  .dark-feat .page-header{text-align:center;margin-bottom:40px}
  .dark-feat .page-header .label{font-size:11px;font-weight:700;letter-spacing:3px;color:#7834FF;margin-bottom:8px}
  .dark-feat .page-header h2{font-size:38px;font-weight:900}
  .dark-feat .page-header p{color:rgba(255,255,255,.6);font-size:15px;margin-top:10px}
  .cards-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
  .feat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;backdrop-filter:blur(10px);transition:all .3s}
  .feat-card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
  .feat-card h3{font-size:17px;font-weight:700;margin-bottom:8px}
  .feat-card p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.6}
  .icon-purple{background:rgba(120,52,255,.3)}
  .icon-orange{background:rgba(249,115,22,.3)}
  .icon-blue{background:rgba(59,130,246,.3)}
  .icon-green{background:rgba(34,197,94,.3)}
  .icon-pink{background:rgba(236,72,153,.3)}
  .icon-cyan{background:rgba(6,182,212,.3)}

  /* ── PAGE 4: FULL LIGHT ── */
  .light-page{background:#f8f9ff;padding:50px;color:#1e293b}
  .light-page .page-header{text-align:center;margin-bottom:36px}
  .light-page .page-header .label{font-size:11px;font-weight:700;letter-spacing:3px;color:#7834FF;margin-bottom:8px}
  .light-page .page-header h2{font-size:36px;font-weight:900;color:#1e293b}
  .light-page .page-header p{color:#64748b;font-size:15px;margin-top:8px}
  .img-showcase{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}
  .img-showcase img,.img-small img{border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:100%;object-fit:cover}
  .img-showcase img{height:200px}
  .img-small{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .img-small img{height:150px}

  /* ── PAGE 5: PRICING / HOW ── */
  .how-page{background:white;padding:50px;color:#1e293b}
  .how-page .page-header{text-align:center;margin-bottom:40px}
  .how-page .page-header .label{font-size:11px;font-weight:700;letter-spacing:3px;color:#7834FF;margin-bottom:8px}
  .how-page .page-header h2{font-size:36px;font-weight:900;color:#1e293b}
  .steps{display:flex;gap:0;position:relative;margin-bottom:40px}
  .steps::before{content:'';position:absolute;top:28px;left:60px;right:60px;height:2px;background:linear-gradient(90deg,#7834FF,#f97316);z-index:0}
  .step{flex:1;text-align:center;position:relative;z-index:1}
  .step-num{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7834FF,#4f1d9c);color:white;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 4px 15px rgba(120,52,255,.4)}
  .step h4{font-size:15px;font-weight:700;margin-bottom:6px;color:#1e293b}
  .step p{font-size:12px;color:#64748b;line-height:1.5;padding:0 10px}
  .compatible{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:10px}
  .compat-item{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#475569}
  .compat-item span{font-size:22px}

  /* ── PAGE 6: CONTACT ── */
  .contact-page{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;justify-content:center;align-items:center;text-align:center;padding:60px}
  .contact-page h2{font-size:44px;font-weight:900;margin-bottom:16px}
  .contact-page h2 span{background:linear-gradient(90deg,#7834FF,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .contact-page .sub{font-size:18px;color:rgba(255,255,255,.7);margin-bottom:50px;max-width:500px;margin-left:auto;margin-right:auto}
  .contact-cards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:50px}
  .contact-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:28px 36px;backdrop-filter:blur(10px)}
  .contact-card .icon{font-size:32px;margin-bottom:10px}
  .contact-card .label{font-size:11px;font-weight:700;letter-spacing:2px;opacity:.6;margin-bottom:6px}
  .contact-card .value{font-size:18px;font-weight:700}
  .tagline{font-size:14px;color:rgba(255,255,255,.4);margin-top:20px}
  .page-num{position:absolute;bottom:18px;right:24px;font-size:11px;opacity:.4;font-weight:600}
</style>
</head>

<!-- PAGE 5: SCREENSHOTS + HOW IT WORKS -->
