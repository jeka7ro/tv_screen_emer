    <title>Screen Media TV2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            cursor: none;
        }

        /* =========================================================
           ANTI-STANDBY HARDWARE LAYERS (Consumer Smart TVs)
           ========================================================= */
        /* 1. Full-screen keepalive video (100vw x 100vh at 0,0) - Exact LG WebOS requirement:
              "Screensaver will NOT appear when a video is playing full screen (100% viewport, position 0,0)." */
        #hw-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
        }

        /* 2. Active 2D Canvas repaint pixel (bottom-left) */
        #keepalive-canvas {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 2px;
            height: 2px;
            z-index: 9998;
            opacity: 0.04;
            pointer-events: none;
        }

        /* 3. ASBL Spike pixel - 2x2px corner flash to reset OLED APL dimming timers */
        #asbl-pixel {
            position: fixed;
            top: 0;
            right: 0;
            width: 2px;
            height: 2px;
            background: #000000;
            z-index: 9999;
            pointer-events: none;
        }

        #asbl-pixel.spike {
            background: #ffffff;
        }

        /* =========================================================
           SLIDES & ROTATION WRAPPER
           ========================================================= */
        #rotation-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            background: #000;
            z-index: 1;
        }

        #slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
            will-change: opacity;
        }

        /* Previous slide stays at opacity 1 underneath active slide for zero black-dip crossfade */
        .slide.prev {
            opacity: 1;
            z-index: 10;
        }

        .slide.active {
            opacity: 1;
            z-index: 20;
        }

        .slide img,
        .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* =========================================================
           EFFECT 1: PARALLAX (3D Gentle Zoom/Pan)
           ========================================================= */
        #slides.parallax-enabled .slide.active img,
        #slides.parallax-enabled .slide.active video {
            animation: tv-parallax 20s ease-in-out infinite;
        }

        @keyframes tv-parallax {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.06);
            }
        }

        /* =========================================================
           EFFECTS & OVERLAYS CONTAINERS
           ========================================================= */
        #effects-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 30;
        }

        #overlays-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 45;
        }

        /* =========================================================
           EFFECT 7: HALLOWEEN (Lilieci, Dovleci & Fantome)
           ========================================================= */
        .halloween-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 30;
        }

        .halloween-item {
            position: absolute;
            top: -15%;
            opacity: 0;
            will-change: transform, top, opacity;
            animation-name: halloween-fall, halloween-sway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
        }

        .halloween-item svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* Bats */
        .halloween-item.halloween-bat {
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.75));
        }

        .halloween-item.halloween-bat svg {
            animation: bat-wing 0.35s ease-in-out infinite alternate;
            transform-origin: center;
        }

        /* Pumpkins */
        .halloween-item.halloween-pumpkin {
            filter: drop-shadow(0 0 14px rgba(249, 115, 22, 0.85));
        }

        .halloween-item.halloween-pumpkin svg {
            animation: pumpkin-wobble 3.2s ease-in-out infinite;
            transform-origin: center;
        }

        /* Ghosts */

            filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65));
        }

            transform-origin: center;
        }

                opacity: 0;

<body>
    <!-- 1. ANTI-SCREENSAVER: Full-screen video layer (The ONLY known fix for LG WebOS) -->

        style="position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:2;opacity:0;pointer-events:none;"></video>

    <!-- 2. ACTIVE 2D CANVAS REPAINT -->
    <canvas id="keepalive-canvas" width="2" height="2"></canvas>

        var SVG_BAT = '<svg viewBox="0 0 48 24" fill="none"><path d="M24 8c-2-3-4.5-5-8-5-4.5 0-9 3.5-12 8-2.5 4-4 5.5-4 5.5s3.5 0 7-2c1.5 3 4.5 5 8 5 3 0 5-1.5 7-4 2 2.5 4 4 7 4 3.5 0 6.5-2 8-5 3.5 2 7 2 7 2s-1.5-1.5-4-5.5c-3-4.5-7.5-8-12-8-3.5 0-6 2-8 5z" fill="#1e1b4b"/><circle cx="22.5" cy="7.5" r="0.9" fill="#ef4444"/><circle cx="25.5" cy="7.5" r="0.9" fill="#ef4444"/></svg>';

        var SVG_PUMPKIN = '<svg viewBox="0 0 32 32" fill="none"><path d="M15 4c0-2 1.5-3 3-3s1.5.5 1 2c-.5 1.5-1.5 2-2 3z" fill="#4ade80"/><ellipse cx="16" cy="18" rx="13" ry="11" fill="#f97316"/><ellipse cx="16" cy="18" rx="9" ry="11" fill="#ea580c" opacity="0.55"/><ellipse cx="16" cy="18" rx="4.5" ry="11" fill="#c2410c" opacity="0.35"/><polygon points="11,13 8,17 14,17" fill="#fef08a"/><polygon points="21,13 18,17 24,17" fill="#fef08a"/><polygon points="16,18 14,20 18,20" fill="#fef08a"/><path d="M10 22c1.5 3 10.5 3 12 0-1 1-2 0-3 1s-2-1-3 0-2-1-3 0-2-1-3-1z" fill="#fef08a"/></svg>';

        var SVG_MAPLE = '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2l1.8 4.2 4-1.2-1.2 4.2 4.8 1.8-3.6 3 3.6 4.2-4.8-.6-1.2 5.4-2.4-4.8L16 28l-1-9.6-2.4 4.8-1.2-5.4-4.8.6 3.6-4.2-3.6-3 4.8-1.8-1.2-4.2 4 1.2L16 2z"/><path d="M16 7v23" stroke="rgba(0,0,0,0.28)" stroke-width="1" stroke-linecap="round"/><path d="M16 13l5-3M16 18l6-2M16 22l4-1M16 13l-5-3M16 18l-6-2M16 22l-4-1" stroke="rgba(0,0,0,0.22)" stroke-width="0.8" stroke-linecap="round"/></svg>';

        var SVG_OAK = '<svg viewBox="0 0 28 36" fill="currentColor"><path d="M14 2c2 2.5 4 2 5 4.5.8 2-.5 4 .5 6 1 1.8 3.5 2.2 3.5 4.5 0 2-2 3-2 5 0 2 2.5 3.5 2 5.5-.5 2-3 2.5-3.5 4.5-.4 1.5.5 2.5 0 3.5-1 2-4 1.5-5.5 2V36h-2v-4.5c-1.5-.5-4.5 0-5.5-2-.5-1 .4-2 0-3.5-.5-2-3-2.5-3.5-4.5-.5-2 2-3.5 2-5.5 0-2-2-3-2-5 0-2.3 2.5-2.7 3.5-4.5 1-2-.3-4 .5-6 1-2.5 3-2 5-4.5z"/><path d="M14 5v29" stroke="rgba(0,0,0,0.28)" stroke-width="1" stroke-linecap="round"/><path d="M14 11l5-2M14 16l6-1M14 21l5-1M14 11l-5-2M14 16l-6-1M14 21l-5-1" stroke="rgba(0,0,0,0.22)" stroke-width="0.8" stroke-linecap="round"/></svg>';

        var SVG_ELM = '<svg viewBox="0 0 24 36" fill="currentColor"><path d="M12 2C6 8 4 17 6 25c1.5 4 4 7 6 9v2h1v-2c2-2 4.5-5 6-9 2-8 0-17-6-23z"/><path d="M12.5 4v29" stroke="rgba(0,0,0,0.28)" stroke-width="0.9" stroke-linecap="round"/><path d="M12.5 9l5-3M12.5 14l6-3M12.5 19l5-2M12.5 24l4-1M12.5 9l-5-3M12.5 14l-6-3M12.5 19l-5-2M12.5 24l-4-1" stroke="rgba(0,0,0,0.22)" stroke-width="0.75" stroke-linecap="round"/></svg>';

        var SVG_HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

        var LEAF_COLORS = ['leaf-gold', 'leaf-orange', 'leaf-crimson', 'leaf-rust', 'leaf-amber', 'leaf-brown'];

        /* =========================================================
           URL PARSING & STATE
           ========================================================= */
        var params = new URLSearchParams(window.location.search);
        var querySlug = params.get('slug') || params.get('s');
        var isPreview = params.get('preview') === 'true';
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var pathSlug = parts.length > 0 ? parts[parts.length - 1] : '';
        var slug = querySlug || pathSlug;

        var isLocal = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname.indexOf('localhost') !== -1;
        var API = isLocal ? 'http://localhost:8002/api' : 'https://tv-screen-emer.onrender.com/api';
        var SUPA_PREFIX = 'https://isdzbwxjtfrykyoeevmy.supabase.co/storage/v1/object/public/content/';

        var currentSlide = 0;
        var slideTimer = null;
        var allSlides = [];
        var currentSlidesSignature = '';
        var currentEffectsSignature = '';
        var currentScreenId = null;
        var hasLoadedOnce = false;
        var enginesStarted = false;

        if (!slug || (parts.length <= 1 && !querySlug && (slug === 'tv' || slug === 'tv2' || slug === 'display')) || slug === 'tv.html' || slug === 'tv2.html') {
            showError('Lipsă slug ecran în URL (ex: /tv2/nume-ecran)');
        } else {
            startAntiStandbyEngines();
            loadScreen(slug, true);
        }

        function proxyUrl(url) {
            if (!url) return '';
            if (isLocal) {
                if (url.indexOf('/api/uploads') === 0 || url.indexOf('/uploads') === 0) {
                    var clean = url.indexOf('/api') === 0 ? url : '/api' + url;
                    return 'http://localhost:8002' + clean;
                }
                return url;
            }
            if (url.indexOf(SUPA_PREFIX) === 0) {
                return '/supabase-media/' + url.substring(SUPA_PREFIX.length);
            }
            return url;
        }

        function showError(msg) {
            if (hasLoadedOnce && allSlides.length > 0) {
                // Never cover an active TV screen with an error message if it already has slides playing!
                return;
            }
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = msg;
        }

        function hideError() {
            document.getElementById('err').style.display = 'none';
        }

        /* =========================================================
           DATA FETCHING & QUIET BACKGROUND SYNC (No Hard Reloads!)
           ========================================================= */
        function loadScreen(targetSlug, isInitial) {
            if (isInitial && !hasLoadedOnce) {
                document.getElementById('loader').style.display = 'block';
            }

            var xhr = new XMLHttpRequest();
            xhr.open('GET', API + '/display/' + targetSlug + '?_t=' + Date.now());
            xhr.timeout = 15000;

            xhr.onload = function () {
                document.getElementById('loader').style.display = 'none';
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        hideError();
                        if (data.screen && data.screen.id) {
                            currentScreenId = data.screen.id;
                        }
                        applyScreenUpdate(data);
                        if (!hasLoadedOnce) {
                            hasLoadedOnce = true;
                            sendHeartbeat();
                        }
                    } catch (e) {
                        showError('Eroare procesare date');
                    }
                } else if (xhr.status === 403) {
                    showError('Cod securitate necesar');
                } else if (!hasLoadedOnce) {
                    showError('Ecran negăsit: ' + targetSlug);
                }
            };

            xhr.onerror = xhr.ontimeout = function () {
                document.getElementById('loader').style.display = 'none';
                if (!hasLoadedOnce) {
                    showError('Conexiune în curs... reîncercare automată');
                    setTimeout(function () { loadScreen(targetSlug, true); }, 5000);
                }
                // If already playing slides (hasLoadedOnce === true), do NOTHING on Wi-Fi blip!
                // Existing slides & effects keep playing uninterrupted from RAM.
            };

            xhr.send();
        }

        function sendHeartbeat() {
            if (isPreview || !currentScreenId) return;
            try {
                var hb = new XMLHttpRequest();
                hb.open('POST', API + '/screens/' + currentScreenId + '/heartbeat');
                hb.timeout = 10000;
                hb.send();
            } catch (e) { }
        }

        /* =========================================================
           SIGNATURE COMPARISON & DYNAMIC DIFF UPDATES
           ========================================================= */
        function extractItems(data) {
            var zones = data.zones_config || data.zones || [];
            var items = [];
            for (var z = 0; z < zones.length; z++) {
                var zone = zones[z];
                if (zone.playlist && zone.playlist.content_items) {
                    var pItems = zone.playlist.content_items;
                    for (var i = 0; i < pItems.length; i++) {
                        items.push({
                            type: pItems[i].type,
                            url: proxyUrl(pItems[i].file_url),
                            thumbnail_url: proxyUrl(pItems[i].thumbnail_url),
                            duration: pItems[i].duration_override || pItems[i].duration || 10
                        });
                    }
                }
                if (zone.content && zone.content.file_url) {
                    items.push({
                        type: zone.content.type,
                        url: proxyUrl(zone.content.file_url),
                        thumbnail_url: proxyUrl(zone.content.thumbnail_url),
                        duration: zone.content.duration || 10
                    });
                }
            }
            return items;
        }

        function computeSlidesSignature(data, items) {
            var s = data.screen || {};
            var z0 = (data.zones_config && data.zones_config[0]) ? data.zones_config[0] : {};
            return JSON.stringify({
                orientation: s.orientation || '0',
                parallax: !!s.parallax_enabled,
                fit_mode: z0.fit_mode || 'cover',
                sync_info: data.sync_info || null,
                items: items
            });
        }

        function computeEffectsSignature(data) {
            var s = data.screen || {};
            return JSON.stringify({
                steam: !!s.steam_enabled,
                sakura: !!s.sakura_enabled,
                sakura_i: s.sakura_intensity || 'medium',
                snow: !!s.snow_enabled,
                snow_i: s.snow_intensity || 'medium',
                hearts: !!s.valentine_hearts_enabled,
                hearts_i: s.valentine_hearts_intensity || 'medium',
                autumn: !!s.autumn_leaves_enabled,
                autumn_i: s.autumn_leaves_intensity || 'medium',
                halloween: !!s.halloween_enabled,
                halloween_i: s.halloween_intensity || 'medium',
                logo_en: !!s.logo_enabled,
                logo_url: s.logo_url || '',
                logo_pos: s.logo_position || 'top-right',
                logo_size: s.logo_size || 'md',
                txt_en: !!s.custom_text_enabled,
                txt_content: s.custom_text_content || '',
                txt_pos: s.custom_text_position || 'bottom-center',
                txt_size: s.custom_text_size || 'md',
                txt_color: s.custom_text_color || '#FFFFFF',
                txt_has_bg: !!s.custom_text_has_background,
                txt_bg: s.custom_text_bg_color || '#000000'
            });
        }

        function applyScreenUpdate(data) {
            var items = extractItems(data);
            var newSlidesSig = computeSlidesSignature(data, items);
            var newEffectsSig = computeEffectsSignature(data);

            // 1. Update rotation & slides ONLY if playlist, orientation, or layout changed
            if (newSlidesSig !== currentSlidesSignature) {
                currentSlidesSignature = newSlidesSig;
                renderSlidesAndRotation(data, items);
            }

            // 2. Update visual effects, logo, and custom text dynamically without interrupting slides
            if (newEffectsSig !== currentEffectsSignature) {
                currentEffectsSignature = newEffectsSig;
                renderEffectsAndOverlays(data.screen || {});
            }
        }

        /* =========================================================
           RENDER ROTATION & SLIDES
           ========================================================= */
        function renderSlidesAndRotation(data, items) {
            if (slideTimer) {
                clearTimeout(slideTimer);
                slideTimer = null;
            }

            var wrapper = document.getElementById('rotation-wrapper');
            var container = document.getElementById('slides');
            container.innerHTML = '';
            currentSlide = 0;

            var screenData = data.screen || {};
            if (screenData.parallax_enabled) {
                container.className = 'parallax-enabled';
            } else {
                container.className = '';
            }

            // TV Rotation Logic - Applied to #rotation-wrapper so slides + effects + overlays rotate together
            var rawOrientation = screenData.orientation;
            var rotation = 0;
            if (rawOrientation === 'portrait') {
                rotation = 90;
            } else if (rawOrientation === 'landscape') {
                rotation = 0;
            } else {
                rotation = parseInt(rawOrientation || '0', 10);
                if (isNaN(rotation)) rotation = 0;
            }

            if (rotation !== 0 && !isPreview) {
                if (rotation === 90) {
                    wrapper.style.transform = 'rotate(90deg)';
                    wrapper.style.transformOrigin = 'top left';
                    wrapper.style.width = '1080px';
                    wrapper.style.height = '1920px';
                    wrapper.style.top = '0px';
                    wrapper.style.left = '1920px';
                } else if (rotation === 270 || rotation === -90) {
                    wrapper.style.transform = 'rotate(270deg)';
                    wrapper.style.transformOrigin = 'top left';
                    wrapper.style.width = '1080px';
                    wrapper.style.height = '1920px';
                    wrapper.style.top = '1080px';
                    wrapper.style.left = '0px';
                } else if (rotation === 180) {
                    wrapper.style.transform = 'rotate(180deg)';
                    wrapper.style.transformOrigin = 'center center';
                    wrapper.style.width = '1920px';
                    wrapper.style.height = '1080px';
                    wrapper.style.top = '0px';
                    wrapper.style.left = '0px';
                }
            } else {
                wrapper.style.transform = 'none';
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                wrapper.style.top = '0px';
                wrapper.style.left = '0px';
            }

            if (items.length === 0) {
                showError('Niciun conținut asociat ecranului');
                return;
            }

            allSlides = items;

            var syncInfo = data.sync_info;
            var isMatrix = syncInfo && syncInfo.sync_type && syncInfo.sync_type.indexOf('matrix') === 0;

            for (var s = 0; s < items.length; s++) {
                var div = document.createElement('div');
                div.className = 'slide' + (s === 0 ? ' active' : '');
                div.id = 'slide-' + s;

                var innerContainer = document.createElement('div');
                if (isMatrix) {
                    var cols = syncInfo.grid_cols || (syncInfo.total_screens === 3 ? 3 : syncInfo.total_screens === 4 ? 2 : 1);
                    var rows = syncInfo.grid_rows || (syncInfo.total_screens === 4 ? 2 : 1);
                    var myIndex = syncInfo.my_index || 0;
                    var myRow = Math.floor(myIndex / cols);
                    var myCol = myIndex % cols;

                    innerContainer.style.width = (cols * 100) + '%';
                    innerContainer.style.height = (rows * 100) + '%';
                    innerContainer.style.transform = 'translate3d(-' + ((myCol * 100) / cols) + '%, -' + ((myRow * 100) / rows) + '%, 0)';
                    innerContainer.style.position = 'absolute';
                    innerContainer.style.left = '0';
                    innerContainer.style.top = '0';
                    innerContainer.style.transformOrigin = 'top left';
                } else {
                    innerContainer.style.width = '100%';
                    innerContainer.style.height = '100%';
                }

                var fitMode = 'cover';
                if (!isMatrix) {
                    var zconfig = (data.zones_config && data.zones_config.length > 0) ? data.zones_config[0] : null;
                    fitMode = (zconfig && zconfig.fit_mode) ? zconfig.fit_mode : 'cover';
                    if (fitMode === 'stretch') fitMode = 'fill';
                    if (fitMode === 'fit') fitMode = 'contain';
                }

                if (items[s].type === 'video') {
                    var vid = document.createElement('video');
                    vid.dataset.src = items[s].url;
                    if (s === 0 || s === 1 || s === items.length - 1) {
                        vid.src = items[s].url;
                    }
                    if (items[s].thumbnail_url) {
                        vid.poster = items[s].thumbnail_url;
                        innerContainer.style.backgroundImage = 'url(' + items[s].thumbnail_url + ')';
                        innerContainer.style.backgroundSize = 'cover';
                        innerContainer.style.backgroundPosition = 'center';
                    }
                    vid.muted = true;
                    vid.loop = true;
                    vid.setAttribute('playsinline', '');
                    vid.setAttribute('webkit-playsinline', '');
                    vid.preload = 'auto';
                    if (s === 0) vid.autoplay = true;
                    vid.style.width = '100%';
                    vid.style.height = '100%';
                    vid.style.objectFit = fitMode;
                    innerContainer.appendChild(vid);
                } else {
                    var img = document.createElement('img');
                    img.src = items[s].url;
                    img.alt = '';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = fitMode;
                    innerContainer.appendChild(img);
                }

                div.appendChild(innerContainer);
                container.appendChild(div);
            }

            // Pre-load images before starting slideshow
            var imagesToLoad = items.filter(function (it) { return it.type === 'image'; });
            var loaded = 0;
            var total = imagesToLoad.length;
            var started = false;

            function startSlideshowOnce() {
                if (started) return;
                started = true;
                if (items.length > 1) {
                    scheduleNextSlide();
                } else if (items.length === 1) {
                    var firstEl = document.getElementById('slide-0');
                    if (firstEl) firstEl.className = 'slide active';
                    var singleVid = firstEl ? firstEl.querySelector('video') : null;
                    if (singleVid) {
                        var p = singleVid.play();
                        if (p !== undefined) p.catch(function () { });
                    }
                }
            }

            if (total === 0) {
                startSlideshowOnce();
            } else {
                // Safety timeout: start slideshow within 4s even if one image is slow
                setTimeout(startSlideshowOnce, 4000);
                for (var pi = 0; pi < imagesToLoad.length; pi++) {
                    (function (src) {
                        var preImg = new Image();
                        preImg.onload = preImg.onerror = function () {
                            loaded++;
                            if (loaded >= total) startSlideshowOnce();
                        };
                        preImg.src = src;
                    })(imagesToLoad[pi].url);
                }
            }
        }

        function scheduleNextSlide() {
            var rawDuration = allSlides[currentSlide] && allSlides[currentSlide].duration;
            var duration = Math.max(4, Number(rawDuration) || 10);

            slideTimer = setTimeout(function () {
                if (allSlides.length <= 1) return;

                var oldSlideIndex = currentSlide;
                var oldSlide = document.getElementById('slide-' + oldSlideIndex);

                currentSlide = (currentSlide + 1) % allSlides.length;

                // Preload next-next video
                var nextNextIndex = (currentSlide + 1) % allSlides.length;
                var nextNextSlide = document.getElementById('slide-' + nextNextIndex);
                if (nextNextSlide) {
                    var nextNextVid = nextNextSlide.querySelector('video');
                    if (nextNextVid && !nextNextVid.getAttribute('src') && nextNextVid.dataset.src) {
                        nextNextVid.src = nextNextVid.dataset.src;
                        nextNextVid.load();
                    }
                }

                // Clear any older '.prev' classes
                for (var i = 0; i < allSlides.length; i++) {
                    if (i !== oldSlideIndex && i !== currentSlide) {
                        var el = document.getElementById('slide-' + i);
                        if (el) el.className = 'slide';
                    }
                }

                // Keep old slide visible underneath (prev) while new slide fades in on top (active)
                if (oldSlide) {
                    oldSlide.className = 'slide prev';
                }

                var newSlide = document.getElementById('slide-' + currentSlide);
                if (newSlide) {
                    var newVid = newSlide.querySelector('video');
                    if (newVid) {
                        if (!newVid.getAttribute('src') && newVid.dataset.src) {
                            newVid.src = newVid.dataset.src;
                            newVid.load();
                        }
                        try { newVid.currentTime = 0; } catch (e) { }
                        var p = newVid.play();
                        if (p !== undefined) p.catch(function () { });
                    }
                    newSlide.className = 'slide active';
                }

                // Flush old video from RAM after crossfade completes (2s)
                setTimeout(function () {
                    if (oldSlide && oldSlideIndex !== currentSlide) {
                        oldSlide.className = 'slide';
                        var oldVid = oldSlide.querySelector('video');
                        if (oldVid) {
                            oldVid.pause();
                            if (allSlides.length > 3) {
                                oldVid.removeAttribute('src');
                                oldVid.load();
                            }
                        }
                    }
                }, 2000);

                scheduleNextSlide();
            }, duration * 1000);
        }

        /* =========================================================
           RENDER VISUAL EFFECTS, LOGO & CUSTOM TEXT OVERLAYS
           ========================================================= */
        function renderEffectsAndOverlays(screen) {
            var effectsLayer = document.getElementById('effects-layer');
            var overlaysLayer = document.getElementById('overlays-layer');
            var effectsHtml = '';

            // 1. Steam Effect (12 particles)
            if (screen.steam_enabled) {
                effectsHtml += '<div class="steam">';
                for (var st = 0; st < 12; st++) {
                    effectsHtml += '<div class="steam-particle"></div>';
                }
                effectsHtml += '</div>';
            }

            // 2. Sakura Effect (25 petals)
            if (screen.sakura_enabled) {
                var sakInt = screen.sakura_intensity || 'medium';
                effectsHtml += '<div class="sakura-container intensity-' + sakInt + '">';
                for (var sk = 0; sk < 25; sk++) {
                    effectsHtml += '<div class="sakura-petal"><div class="sakura-petal-inner"></div></div>';
                }
                effectsHtml += '</div>';
            }

            // 3. Snow Effect (35 snowflakes)
            if (screen.snow_enabled) {
                var snwInt = screen.snow_intensity || 'medium';
                effectsHtml += '<div class="snow-container intensity-' + snwInt + '">';
                for (var sn = 0; sn < 35; sn++) {
                    effectsHtml += '<div class="snowflake"></div>';
                }
                effectsHtml += '</div>';
            }

            // 4. Valentine Hearts Effect (25 SVG hearts)
            if (screen.valentine_hearts_enabled) {
                var hrtInt = screen.valentine_hearts_intensity || 'medium';
                effectsHtml += '<div class="hearts-container intensity-' + hrtInt + '">';
                for (var hr = 0; hr < 25; hr++) {
                    effectsHtml += '<div class="floating-heart">' + SVG_HEART + '</div>';
                }
                effectsHtml += '</div>';
            }

            // 5. Autumn Leaves Effect (25 SVG leaves: Maple, Oak, Elm)
            if (screen.autumn_leaves_enabled) {
                var autInt = screen.autumn_leaves_intensity || 'medium';
                effectsHtml += '<div class="autumn-leaves-container intensity-' + autInt + '">';
                for (var lf = 0; lf < 25; lf++) {
                    var colorCls = LEAF_COLORS[lf % LEAF_COLORS.length];
                    var leafType = lf % 3;
                    var leafSvg = leafType === 0 ? SVG_MAPLE : (leafType === 1 ? SVG_OAK : SVG_ELM);
                    effectsHtml += '<div class="autumn-leaf ' + colorCls + '">' + leafSvg + '</div>';
                }
                effectsHtml += '</div>';
            }

            // 6. Halloween Effect (20 SVG items: Bats, Pumpkins, Ghosts)
            if (screen.halloween_enabled) {
                var halInt = screen.halloween_intensity || 'medium';
                effectsHtml += '<div class="halloween-container intensity-' + halInt + '">';
                for (var hw = 0; hw < 20; hw++) {
                    var hwType = hw % 3;
                    if (hwType === 0) {
                        effectsHtml += '<div class="halloween-item halloween-bat">' + SVG_BAT + '</div>';
                    } else if (hwType === 1) {
                        effectsHtml += '<div class="halloween-item halloween-pumpkin">' + SVG_PUMPKIN + '</div>';
                    } else {
                        effectsHtml += '<div class="halloween-item halloween-ghost">' + SVG_GHOST + '</div>';
                    }
                }
                effectsHtml += '</div>';
            }

            effectsLayer.innerHTML = effectsHtml;

            // Overlays: Brand Logo + Custom Text
            overlaysLayer.innerHTML = '';

            // 7. Brand Logo Overlay
            if (screen.logo_enabled && screen.logo_url) {
                var logoDiv = document.createElement('div');
                logoDiv.style.position = 'absolute';
                logoDiv.style.zIndex = '45';
                logoDiv.style.pointerEvents = 'none';

                applyPositionStyles(logoDiv, screen.logo_position || 'top-right', '12px');

                var size = screen.logo_size || 'md';
                var dim = '3.5vw';
                if (size === 'sm') dim = '2vw';
                else if (size === 'lg') dim = '5vw';
                else if (size === 'xl') dim = '7vw';

                logoDiv.style.width = dim;
                logoDiv.style.height = dim;

                var logoImg = document.createElement('img');
                logoImg.src = proxyUrl(screen.logo_url);
                logoImg.style.width = '100%';
                logoImg.style.height = '100%';
                logoImg.style.objectFit = 'contain';
                logoImg.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.5))';

                logoDiv.appendChild(logoImg);
                overlaysLayer.appendChild(logoDiv);
            }

            // 8. Custom Text Overlay
            if (screen.custom_text_enabled && screen.custom_text_content) {
                var textWrap = document.createElement('div');
                textWrap.style.position = 'absolute';
                textWrap.style.zIndex = '50';
                textWrap.style.pointerEvents = 'none';

                applyPositionStyles(textWrap, screen.custom_text_position || 'bottom-center', '16px');

                var textBox = document.createElement('div');
                textBox.style.fontWeight = '700';
                textBox.style.color = screen.custom_text_color || '#FFFFFF';
                textBox.style.whiteSpace = 'pre-wrap';
                textBox.style.textAlign = 'center';

                var txtSize = screen.custom_text_size || 'md';
                if (txtSize === 'sm') textBox.style.fontSize = '1.5rem';
                else if (txtSize === 'lg') textBox.style.fontSize = '3.75rem';
                else if (txtSize === 'xl') textBox.style.fontSize = '6rem';
                else textBox.style.fontSize = '2.25rem';

                if (screen.custom_text_has_background) {
                    textBox.style.backgroundColor = screen.custom_text_bg_color || '#000000';
                    textBox.style.padding = '12px 24px';
                    textBox.style.borderRadius = '16px';
                    textBox.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
                } else {
                    textBox.style.textShadow = '0 2px 8px rgba(0,0,0,0.85)';
                }

                textBox.textContent = screen.custom_text_content;
                textWrap.appendChild(textBox);
                overlaysLayer.appendChild(textWrap);
            }
        }

        function applyPositionStyles(el, pos, offset) {
            if (pos === 'top-left') {
                el.style.top = offset; el.style.left = offset;
            } else if (pos === 'top-center') {
                el.style.top = offset; el.style.left = '50%'; el.style.transform = 'translateX(-50%)';
            } else if (pos === 'top-right') {
                el.style.top = offset; el.style.right = offset;
            } else if (pos === 'center-left') {
                el.style.top = '50%'; el.style.left = offset; el.style.transform = 'translateY(-50%)';
            } else if (pos === 'center') {
                el.style.top = '50%'; el.style.left = '50%'; el.style.transform = 'translate(-50%, -50%)';
            } else if (pos === 'center-right') {
                el.style.top = '50%'; el.style.right = offset; el.style.transform = 'translateY(-50%)';
            } else if (pos === 'bottom-left') {
                el.style.bottom = offset; el.style.left = offset;
            } else if (pos === 'bottom-center') {
                el.style.bottom = offset; el.style.left = '50%'; el.style.transform = 'translateX(-50%)';
            } else if (pos === 'bottom-right') {
                el.style.bottom = offset; el.style.right = offset;
            }
        }

        /* =========================================================
           MULTI-LAYER ANTI-STANDBY ENGINE (RUNS ONCE, NO LEAKS)
           ========================================================= */
        function startAntiStandbyEngines() {
            if (enginesStarted) return;
            enginesStarted = true;

            // 1. Background API Sync every 60s (updates slides & effects without page reload)
            setInterval(function () {
                loadScreen(slug, false);
            }, 60000);

            // 2. Heartbeat every 60s
            setInterval(function () {
                sendHeartbeat();
            }, 60000);

            if (isPreview) return;

            // 3. Layer 0: 9-Minute Hard Navigation Refresh (Exact proven mechanism from tv.html)
            // Resets LG WebOS 10/15-min browser inactivity timer and clears TV GPU/RAM memory.
            // Checks connectivity first so a momentary Wi-Fi drop doesn't show a browser offline screen.
            function triggerHardRefresh() {
                var ping = new XMLHttpRequest();
                ping.open('HEAD', '/keepalive.mp4?_t=' + Date.now());
                ping.timeout = 5000;
                ping.onload = function () {
                    var currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.set('t', Date.now().toString());
                    window.location.replace(currentUrl.toString());
                };
                ping.onerror = ping.ontimeout = function () {
                    // Wi-Fi is momentarily down; retry refresh in 30s once connection is back
                    setTimeout(triggerHardRefresh, 30000);
                };
                ping.send();
            }
            setInterval(triggerHardRefresh, 9 * 60 * 1000); // 9 minutes (540,000 ms)

            // 4. Screen WakeLock API (re-requested automatically)
            var currentWakeLock = null;
            function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator && navigator.wakeLock) {
                        navigator.wakeLock.request('screen').then(function (lock) {
                            currentWakeLock = lock;
                        }).catch(function () { });
                    }
                } catch (e) { }
            }
            requestWakeLock();
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') requestWakeLock();
            });
            setInterval(function () {
                if (!currentWakeLock || currentWakeLock.released) {
                    requestWakeLock();
                }
            }, 30000);

            // 4. Hardware Video Keep-Alive (4x4px, opacity 0.04, top z-index)
            var hwVideo = document.getElementById('hw-video');
            function ensureHwVideoPlaying() {
                if (!hwVideo) return;
                try {
                    if (hwVideo.paused || hwVideo.ended) {
                        var p = hwVideo.play();
                        if (p !== undefined) p.catch(function () { });
                    }
                } catch (e) { }
            }
            ensureHwVideoPlaying();
            setInterval(ensureHwVideoPlaying, 5000);

            // Also ensure active slide video never stalls
            setInterval(function () {
                try {
                    var activeSlide = document.querySelector('.slide.active video');
                    if (activeSlide && activeSlide.paused) {
                        var p = activeSlide.play();
                        if (p !== undefined) p.catch(function () { });
                    }
                } catch (e) { }
            }, 5000);

            // 5. Continuous 2D Canvas Repaint (every 1s) for Hisense VIDAA / Tizen GPU activity
            var canvas = document.getElementById('keepalive-canvas');
            var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
            var toggleBit = 0;
            setInterval(function () {
                try {
                    if (ctx) {
                        toggleBit = 1 - toggleBit;
                        ctx.fillStyle = toggleBit ? '#050505' : '#0a0a0a';
                        ctx.fillRect(0, 0, 2, 2);
                    }
                } catch (e) { }
            }, 1000);

            // 6. Web Audio API Inaudible Oscillator (keeps TV MediaSession active)
            var audioCtx = null;
            function ensureSilentAudio() {
                try {
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;
                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                        var osc = audioCtx.createOscillator();
                        var gain = audioCtx.createGain();
                        gain.gain.value = 0.0001; // Inaudible
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(0);
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(function () { });
                    }
                } catch (e) { }
            }
            ensureSilentAudio();

            // Unlock video + audio on any remote control key or pointer event
            function onUserActivity() {
                ensureHwVideoPlaying();
                ensureSilentAudio();
                requestWakeLock();
            }
            document.addEventListener('click', onUserActivity);
            document.addEventListener('keydown', onUserActivity);
            document.addEventListener('mousemove', onUserActivity);
            document.addEventListener('touchstart', onUserActivity);

            // 7. ASBL APL Pixel Spike every 2.5 minutes (resets LG OLED dimming timer)
            var asblPixel = document.getElementById('asbl-pixel');
            setInterval(function () {
                try {
                    if (asblPixel) {
                        asblPixel.classList.add('spike');
                        setTimeout(function () {
                            asblPixel.classList.remove('spike');
                        }, 250);
                    }
                } catch (e) { }
            }, 150000);
        }
    </script>
