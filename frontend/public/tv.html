<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="refresh" content="180">

    <title>Screen Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000
        }

        @keyframes asbl-drift {
            0% {
                transform: scale(1.0) translate(0, 0);
            }

            25% {
                transform: scale(1.02) translate(1%, 1%);
            }

            50% {
                transform: scale(1.04) translate(-1%, 0%);
            }

            75% {
                transform: scale(1.02) translate(0%, -1%);
            }

            100% {
                transform: scale(1.0) translate(0, 0);
            }
        }

        #slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: asbl-drift 120s linear infinite;
        }

        /* Nuclear ASBL Flash Class - Inverts all pixels to forcefully reset hardware OLED APL timers */
        html.asbl-spike-active,
        body.asbl-spike-active {
            filter: invert(1) hue-rotate(180deg) contrast(200%) brightness(150%) !important;
            background: #fff !important;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out
        }

        .slide.active {
            opacity: 1
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font: 16px Arial;
            display: none
        }

        #err {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f44;
            font: 20px Arial;
            display: none
        }
    </style>
</head>

<body>
    <!-- ANTI-SCREENSAVER: Full-screen video layer (The ONLY known fix for LG WebOS OLEDs) -->
    <!-- Official WebOS documentation: "Screensaver will NOT appear when a video is playing full screen (100% viewport, position 0,0)." -->
    <video id="hw-video" src="/keepalive.mp4" autoplay loop muted playsinline webkit-playsinline
        style="position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:0.01;pointer-events:none;background:#000;"></video>

    <div id="slides"></div>
    <div id="loader">⏳</div>
    <div id="err"></div>
    <script>
        // Parse slug from URL: /tv/SLUG or /display/SLUG
        var path = window.location.pathname;
        var parts = path.split('/');
        var slug = parts[parts.length - 1] || parts[parts.length - 2];

        if (!slug || slug === 'tv' || slug === 'display') {
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = 'No screen slug in URL';
        } else {
            loadScreen(slug);
        }

        function loadScreen(slug) {
            document.getElementById('loader').style.display = 'block';

            // API URL - use the same backend
            var API = 'https://tv-screen-emer.onrender.com/api';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', API + '/display/' + slug);
            xhr.onload = function () {
                document.getElementById('loader').style.display = 'none';
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        renderScreen(data);
                        // heartbeat
                        if (data.screen && data.screen.id) {
                            var hb = new XMLHttpRequest();
                            hb.open('POST', API + '/screens/' + data.screen.id + '/heartbeat');
                            hb.send();
                        }
                    } catch (e) {
                        showError('Parse error');
                    }
                } else if (xhr.status === 403) {
                    showError('Cod securitate necesar');
                } else {
                    showError('Ecran negăsit: ' + slug);
                }
            };
            xhr.onerror = function () {
                document.getElementById('loader').style.display = 'none';
                showError('Network error - retrying...');
                setTimeout(function () { loadScreen(slug); }, 5000);
            };
            xhr.send();
        }

        function showError(msg) {
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = msg;
        }

        // Supabase URL prefix → Netlify CDN proxy
        var SUPA_PREFIX = 'https://isdzbwxjtfrykyoeevmy.supabase.co/storage/v1/object/public/content/';
        function proxyUrl(url) {
            if (!url) return '';
            if (url.indexOf(SUPA_PREFIX) === 0) {
                return '/supabase-media/' + url.substring(SUPA_PREFIX.length);
            }
            return url;
        }

        var currentSlide = 0;
        var slideTimer = null;
        var allSlides = [];

        function renderScreen(data) {
            var container = document.getElementById('slides');
            var zones = data.zones_config || data.zones || [];
            var items = [];

            // Collect all content items from all zones
            for (var z = 0; z < zones.length; z++) {
                var zone = zones[z];
                // Playlist items
                if (zone.playlist && zone.playlist.content_items) {
                    var pItems = zone.playlist.content_items;
                    for (var i = 0; i < pItems.length; i++) {
                        items.push({
                            type: pItems[i].type,
                            url: proxyUrl(pItems[i].file_url),
                            duration: pItems[i].duration || 10
                        });
                    }
                }
                // Single content
                if (zone.content && zone.content.file_url) {
                    items.push({
                        type: zone.content.type,
                        url: proxyUrl(zone.content.file_url),
                        duration: zone.content.duration || 10
                    });
                }
            }

            if (items.length === 0) {
                showError('Niciun conținut');
                return;
            }

            allSlides = items;

            // Create slide elements
            for (var s = 0; s < items.length; s++) {
                var div = document.createElement('div');
                div.className = 'slide' + (s === 0 ? ' active' : '');
                div.id = 'slide-' + s;

                if (items[s].type === 'video') {
                    var vid = document.createElement('video');
                    vid.src = items[s].url;
                    vid.muted = true;
                    vid.loop = true;
                    vid.autoplay = true;
                    vid.setAttribute('playsinline', '');
                    div.appendChild(vid);
                } else {
                    var img = document.createElement('img');
                    img.src = items[s].url;
                    img.alt = '';
                    div.appendChild(img);
                }
                container.appendChild(div);
            }

            // Start slideshow if multiple items
            if (items.length > 1) {
                nextSlide();
            }

            // Anti-standby: The "Safe" Combo (Meta Refresh + 100% Transparent Video + WakeLock)

            // Layer 1: WakeLock API
            function reqWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        navigator.wakeLock.request('screen').catch(function () { });
                    }
                } catch (e) { }
            }
            reqWakeLock();
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reqWakeLock();
            });

            // Layer 2: Ensure the full-screen transparent video is playing
            try {
                var hwVideo = document.getElementById('hw-video');
                var playPromise = hwVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function (error) {
                        // Autoplay was prevented. Will be triggered by any remote click.
                    });
                }

                // Retry play every 10s to ensure it stays active
                setInterval(function () {
                    if (hwVideo && hwVideo.paused) {
                        hwVideo.play().catch(function () { });
                    }
                }, 10000);

                // Play on any user interaction with the remote
                document.addEventListener('click', function () { hwVideo.play().catch(function () { }); });
                document.addEventListener('keydown', function () { hwVideo.play().catch(function () { }); });
                document.addEventListener('mousemove', function () { hwVideo.play().catch(function () { }); });
            } catch (e) { }

            // Layer 3: The Nuclear ASBL APL Spike (100ms flash every 2.5 minutes)
            // Forces a continuous hard pixel flip to reset OLED APL hardware timers before the TV turns off at 3-4 mins.
            setInterval(function () {
                try {
                    document.body.classList.add('asbl-spike-active');
                    setTimeout(function () {
                        document.body.classList.remove('asbl-spike-active');
                    }, 100);
                } catch (e) { }
            }, 150000);

            // Re-fetch data every 5 minutes (in case content changed)
            setInterval(function () {
                loadScreen(slug);
            }, 300000);
        }

        function nextSlide() {
            var duration = (allSlides[currentSlide] && allSlides[currentSlide].duration) || 10;
            slideTimer = setTimeout(function () {
                var oldSlide = document.getElementById('slide-' + currentSlide);
                if (oldSlide) oldSlide.className = 'slide';

                currentSlide = (currentSlide + 1) % allSlides.length;

                var newSlide = document.getElementById('slide-' + currentSlide);
                if (newSlide) newSlide.className = 'slide active';

                nextSlide();
            }, duration * 1000);
        }
    </script>
</body>

</html>
