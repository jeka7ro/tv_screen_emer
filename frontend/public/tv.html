<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate">
    <meta http-equiv="pragma" content="no-cache">

    <title>Screen Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000
        }

        /* OLED anti-burn: change EVERY pixel continuously to fool hardware static detector */
        @keyframes oled-brightness {
            0% {
                filter: brightness(1.0)
            }

            25% {
                filter: brightness(0.97)
            }

            50% {
                filter: brightness(1.0)
            }

            75% {
                filter: brightness(1.03)
            }

            100% {
                filter: brightness(1.0)
            }
        }

        @keyframes oled-shift {
            0% {
                transform: translate(0, 0) scale(1.005)
            }

            25% {
                transform: translate(3px, -2px) scale(1.005)
            }

            50% {
                transform: translate(-2px, 3px) scale(1.005)
            }

            75% {
                transform: translate(3px, 2px) scale(1.005)
            }

            100% {
                transform: translate(0, 0) scale(1.005)
            }
        }

        #slides {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            animation: oled-shift 30s linear infinite, oled-brightness 4s ease-in-out infinite;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out
        }

        .slide.active {
            opacity: 1
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font: 16px Arial;
            display: none
        }

        #err {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f44;
            font: 20px Arial;
            display: none
        }
    </style>
</head>

<body>
    <div id="slides"></div>
    <div id="loader">⏳</div>
    <div id="err"></div>

    <!-- Invisible video that plays a real mp4 to trigger hardware decoder -->
    <video id="hw-video" muted loop playsinline webkit-playsinline
        style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;opacity:0.01;pointer-events:none;object-fit:cover"></video>
    <script>
        // Parse slug from URL: /tv/SLUG or /display/SLUG
        var path = window.location.pathname;
        var parts = path.split('/');
        var slug = parts[parts.length - 1] || parts[parts.length - 2];

        if (!slug || slug === 'tv' || slug === 'display') {
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = 'No screen slug in URL';
        } else {
            loadScreen(slug);
        }

        function loadScreen(slug) {
            document.getElementById('loader').style.display = 'block';

            // API URL - use the same backend
            var API = 'https://tv-screen-emer.onrender.com/api';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', API + '/display/' + slug);
            xhr.onload = function () {
                document.getElementById('loader').style.display = 'none';
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        renderScreen(data);
                        // heartbeat
                        if (data.screen && data.screen.id) {
                            var hb = new XMLHttpRequest();
                            hb.open('POST', API + '/screens/' + data.screen.id + '/heartbeat');
                            hb.send();
                        }
                    } catch (e) {
                        showError('Parse error');
                    }
                } else if (xhr.status === 403) {
                    showError('Cod securitate necesar');
                } else {
                    showError('Ecran negăsit: ' + slug);
                }
            };
            xhr.onerror = function () {
                document.getElementById('loader').style.display = 'none';
                showError('Network error - retrying...');
                setTimeout(function () { loadScreen(slug); }, 5000);
            };
            xhr.send();
        }

        function showError(msg) {
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = msg;
        }

        // Supabase URL prefix → Netlify CDN proxy
        var SUPA_PREFIX = 'https://isdzbwxjtfrykyoeevmy.supabase.co/storage/v1/object/public/content/';
        function proxyUrl(url) {
            if (!url) return '';
            if (url.indexOf(SUPA_PREFIX) === 0) {
                return '/supabase-media/' + url.substring(SUPA_PREFIX.length);
            }
            return url;
        }

        var currentSlide = 0;
        var slideTimer = null;
        var allSlides = [];

        function renderScreen(data) {
            var container = document.getElementById('slides');
            var zones = data.zones_config || data.zones || [];
            var items = [];

            // Collect all content items from all zones
            for (var z = 0; z < zones.length; z++) {
                var zone = zones[z];
                // Playlist items
                if (zone.playlist && zone.playlist.content_items) {
                    var pItems = zone.playlist.content_items;
                    for (var i = 0; i < pItems.length; i++) {
                        items.push({
                            type: pItems[i].type,
                            url: proxyUrl(pItems[i].file_url),
                            duration: pItems[i].duration || 10
                        });
                    }
                }
                // Single content
                if (zone.content && zone.content.file_url) {
                    items.push({
                        type: zone.content.type,
                        url: proxyUrl(zone.content.file_url),
                        duration: zone.content.duration || 10
                    });
                }
            }

            if (items.length === 0) {
                showError('Niciun conținut');
                return;
            }

            allSlides = items;

            // Create slide elements
            for (var s = 0; s < items.length; s++) {
                var div = document.createElement('div');
                div.className = 'slide' + (s === 0 ? ' active' : '');
                div.id = 'slide-' + s;

                if (items[s].type === 'video') {
                    var vid = document.createElement('video');
                    vid.src = items[s].url;
                    vid.muted = true;
                    vid.loop = true;
                    vid.autoplay = true;
                    vid.setAttribute('playsinline', '');
                    div.appendChild(vid);
                } else {
                    var img = document.createElement('img');
                    img.src = items[s].url;
                    img.alt = '';
                    div.appendChild(img);
                }
                container.appendChild(div);
            }

            // Start slideshow if multiple items
            if (items.length > 1) {
                nextSlide();
            }

            // Anti-standby: MAXIMUM AGGRESSION for LG CX WebOS OLED
            // Layer 0: Hidden iframe that navigates every 30s (browser-level activity, no visible flash)
            var keepFrame = document.createElement('iframe');
            keepFrame.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-999;border:none';
            document.body.appendChild(keepFrame);
            setInterval(function () {
                try { keepFrame.contentWindow.location.replace('about:blank#' + Date.now()); } catch (e) { }
                try { keepFrame.src = 'about:blank?t=' + Date.now(); } catch (e) { }
            }, 30000);

            // Layer 1: Simulate REAL hardware input events every 3s
            setInterval(function () {
                // Title flicker
                var t = document.title;
                document.title = t + ' ';
                setTimeout(function () { document.title = t; }, 100);

                // Simulate mouse movement across the screen (OS-level detection)
                try {
                    var mx = Math.random() * window.innerWidth;
                    var my = Math.random() * window.innerHeight;
                    var mouseEvt = new MouseEvent('mousemove', {
                        bubbles: true, cancelable: true, clientX: mx, clientY: my, screenX: mx, screenY: my
                    });
                    document.dispatchEvent(mouseEvt);
                    document.elementFromPoint(mx, my) && document.elementFromPoint(mx, my).dispatchEvent(mouseEvt);
                } catch (e) { }

                // Simulate keyboard activity
                try {
                    var keyEvt = new KeyboardEvent('keydown', { bubbles: true, key: 'F15', keyCode: 126 });
                    document.dispatchEvent(keyEvt);
                    var keyUp = new KeyboardEvent('keyup', { bubbles: true, key: 'F15', keyCode: 126 });
                    document.dispatchEvent(keyUp);
                } catch (e) { }

                // Simulate touch events
                try {
                    var touch = new Touch({ identifier: Date.now(), target: document.body, clientX: mx, clientY: my });
                    var touchEvt = new TouchEvent('touchstart', { bubbles: true, touches: [touch], targetTouches: [touch] });
                    document.body.dispatchEvent(touchEvt);
                } catch (e) { }

                // Simulate pointer events
                try {
                    var ptrEvt = new PointerEvent('pointermove', { bubbles: true, clientX: mx, clientY: my, pointerType: 'mouse' });
                    document.dispatchEvent(ptrEvt);
                } catch (e) { }

                // Window scroll 
                try { window.scrollTo(0, 1); window.scrollTo(0, 0); } catch (e) { }
                try { window.dispatchEvent(new Event('scroll')); } catch (e) { }

                // Focus/blur cycle — may trigger OS activity
                try { window.blur(); setTimeout(function () { window.focus(); }, 50); } catch (e) { }

                // History state push — URL change may count as activity
                try {
                    var ts = Date.now();
                    history.replaceState({ ts: ts }, '', window.location.pathname + '?_=' + (ts % 10000));
                } catch (e) { }

            }, 3000);

            // Layer 1b: WebOS specific API calls
            setInterval(function () {
                // Try LG WebOS Luna service bus
                try {
                    if (window.webOS && window.webOS.service) {
                        window.webOS.service.request('luna://com.webos.settingsservice', {
                            method: 'getSystemSettings',
                            parameters: { keys: ['screenSaverTimeout'] },
                            onSuccess: function () { },
                            onFailure: function () { }
                        });
                    }
                } catch (e) { }
                // Try PalmSystem keepAlive
                try {
                    if (window.PalmSystem) {
                        window.PalmSystem.keepAlive(true);
                        window.PalmSystem.stageReady();
                    }
                } catch (e) { }
                // Try webOS notification to reset timer
                try {
                    if (window.webOS && window.webOS.notification) {
                        window.webOS.notification.createToast({ message: ' ', noaction: true });
                    }
                } catch (e) { }
            }, 30000);

            // Layer 2: WakeLock API
            function reqWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        navigator.wakeLock.request('screen').catch(function () { });
                    }
                } catch (e) { }
            }
            reqWakeLock();
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reqWakeLock();
            });

            // Layer 3: REAL video through hardware decoder + Media Session API + AudioContext
            // Make the hardware video element play one of the ACTUAL content videos/images
            try {
                var hwVideo = document.getElementById('hw-video');
                // Find a video item from content, or use any item URL
                var videoItem = null;
                for (var vi = 0; vi < allSlides.length; vi++) {
                    if (allSlides[vi].type === 'video') { videoItem = allSlides[vi]; break; }
                }
                if (videoItem) {
                    hwVideo.src = videoItem.url;
                    hwVideo.play().catch(function () { });
                } else {
                    // No video content — create a blob video from canvas
                    try {
                        var c = document.createElement('canvas');
                        c.width = 16; c.height = 16;
                        var cx = c.getContext('2d');
                        cx.fillStyle = '#000';
                        cx.fillRect(0, 0, 16, 16);
                        var mediaRecorder;
                        var chunks = [];
                        var cStream = c.captureStream(1);
                        mediaRecorder = new MediaRecorder(cStream, { mimeType: 'video/webm' });
                        mediaRecorder.ondataavailable = function (e) { chunks.push(e.data); };
                        mediaRecorder.onstop = function () {
                            var blob = new Blob(chunks, { type: 'video/webm' });
                            hwVideo.src = URL.createObjectURL(blob);
                            hwVideo.play().catch(function () { });
                        };
                        mediaRecorder.start();
                        setTimeout(function () { mediaRecorder.stop(); }, 1000);
                    } catch (e) { }
                }
                // Retry play every 3s
                setInterval(function () {
                    if (hwVideo.paused) hwVideo.play().catch(function () { });
                }, 3000);
            } catch (e) { }

            // Media Session API — register as active media player with OS
            try {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'Screen Media Display',
                        artist: 'Digital Signage',
                        album: 'Live Content'
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    // Keep updating playback state
                    setInterval(function () {
                        try { navigator.mediaSession.playbackState = 'playing'; } catch (e) { }
                    }, 5000);
                }
            } catch (e) { }

            // AudioContext — generate real (silent) audio stream
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var oscillator = audioCtx.createOscillator();
                var gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.001; // nearly silent
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 1; // 1Hz = inaudible
                oscillator.start();
                // Keep audio context alive
                setInterval(function () {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(function () { });
                    }
                }, 3000);
            } catch (e) { }

            // Layer 4: Periodic DOM mutation (some TVs detect DOM inactivity)
            var mutDiv = document.createElement('div');
            mutDiv.style.cssText = 'position:fixed;bottom:0;right:0;width:1px;height:1px;overflow:hidden;opacity:0.01';
            document.body.appendChild(mutDiv);
            setInterval(function () {
                mutDiv.textContent = Date.now().toString(36);
            }, 5000);

            // Re-fetch data every 5 minutes (in case content changed)
            setInterval(function () {
                loadScreen(slug);
            }, 300000);
        }

        function nextSlide() {
            var duration = (allSlides[currentSlide] && allSlides[currentSlide].duration) || 10;
            slideTimer = setTimeout(function () {
                var oldSlide = document.getElementById('slide-' + currentSlide);
                if (oldSlide) oldSlide.className = 'slide';

                currentSlide = (currentSlide + 1) % allSlides.length;

                var newSlide = document.getElementById('slide-' + currentSlide);
                if (newSlide) newSlide.className = 'slide active';

                nextSlide();
            }, duration * 1000);
        }
    </script>
</body>

</html>
