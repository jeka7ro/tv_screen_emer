<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creează Demo TV Screen - GetApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 1.5rem;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 relative">
  <!-- Bg Image -->
  <div class="fixed inset-0 z-0 bg-cover bg-center bg-no-repeat opacity-20" style="background-image: url('./images/restaurant_kiosk.png')"></div>

  <div class="w-full max-w-2xl relative z-10 glass-card p-8 transition-transform duration-500 hover:scale-[1.01]">
    <div class="flex justify-center mb-8">
      <img src="./getapp_smart_displays_white.png" alt="Get App" class="h-16 w-auto object-contain">
    </div>

    <h1 class="text-3xl font-black text-center mb-2 tracking-widest text-[#00ced1]">GENEREAZĂ DEMO LIVE</h1>
    <p class="text-center text-slate-400 mb-8 text-sm">Vei genera un link valabil exact 5 minute pe care îl poți trimite oricui pe WhatsApp sau deschide pe Smart TV-ul tău, simulând perfect platforma GetApp.</p>

    <div class="space-y-6">
      
      <!-- Imagine -->
      <div>
        <label class="block text-sm font-bold text-slate-300 mb-3 uppercase tracking-wider">1. Alege Imaginea de Fundal</label>
        <div class="grid grid-cols-3 gap-4 mb-4">
          <label class="cursor-pointer relative rounded-xl overflow-hidden border-2 border-transparent hover:border-[#00ced1] transition-all">
            <input type="radio" name="bgImage" value="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1965&auto=format&fit=crop" class="peer sr-only" checked>
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=400&h=300&fit=crop" class="w-full h-24 object-cover">
            <div class="absolute inset-0 bg-slate-900/50 peer-checked:bg-transparent transition-all"></div>
            <div class="hidden peer-checked:block absolute top-2 right-2 bg-[#00ced1] text-slate-900 text-xs font-bold px-2 py-1 rounded">Selectat</div>
          </label>
          <label class="cursor-pointer relative rounded-xl overflow-hidden border-2 border-transparent hover:border-[#00ced1] transition-all">
            <input type="radio" name="bgImage" value="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=1964&auto=format&fit=crop" class="peer sr-only">
            <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=400&h=300&fit=crop" class="w-full h-24 object-cover">
            <div class="absolute inset-0 bg-slate-900/50 peer-checked:bg-transparent transition-all"></div>
            <div class="hidden peer-checked:block absolute top-2 right-2 bg-[#00ced1] text-slate-900 text-xs font-bold px-2 py-1 rounded">Selectat</div>
          </label>
          <label class="cursor-pointer relative rounded-xl overflow-hidden border-2 border-transparent hover:border-[#00ced1] transition-all">
            <input type="radio" name="bgImage" value="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1964&auto=format&fit=crop" class="peer sr-only">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=400&h=300&fit=crop" class="w-full h-24 object-cover">
            <div class="absolute inset-0 bg-slate-900/50 peer-checked:bg-transparent transition-all"></div>
            <div class="hidden peer-checked:block absolute top-2 right-2 bg-[#00ced1] text-slate-900 text-xs font-bold px-2 py-1 rounded">Selectat</div>
          </label>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 font-bold uppercase">Sau pune link URL direct:</span>
          <input type="url" id="customUrl" placeholder="https://..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#00ced1]">
        </div>
      </div>

      <!-- Efecte -->
      <div>
        <label class="block text-sm font-bold text-slate-300 mb-3 uppercase tracking-wider">2. Alege un Efect Cinematografic</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="effect" value="none" class="peer sr-only" checked>
            <div class="border border-slate-700 rounded-xl p-3 text-center peer-checked:bg-[#00ced1]/20 peer-checked:border-[#00ced1] peer-checked:text-[#00ced1] transition-all">
              🚫 Fără Efect
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="effect" value="steam" class="peer sr-only">
            <div class="border border-slate-700 rounded-xl p-3 text-center peer-checked:bg-slate-700/50 peer-checked:border-slate-400 peer-checked:text-white transition-all">
              💨 Abur (Cafea)
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="effect" value="sakura" class="peer sr-only">
            <div class="border border-slate-700 rounded-xl p-3 text-center peer-checked:bg-pink-500/20 peer-checked:border-pink-500 peer-checked:text-pink-400 transition-all">
              🌸 Sakura
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="effect" value="hearts" class="peer sr-only">
            <div class="border border-slate-700 rounded-xl p-3 text-center peer-checked:bg-red-500/20 peer-checked:border-red-500 peer-checked:text-red-400 transition-all">
              ❤️ Inimioare
            </div>
          </label>
        </div>
      </div>

      <!-- Button -->
      <div class="pt-6 border-t border-slate-800">
        <button onclick="generateLink()" class="w-full bg-[#00ced1] hover:bg-[#20b2aa] text-slate-900 font-black text-lg py-4 rounded-xl shadow-[0_0_30px_rgba(0,206,209,0.3)] hover:shadow-[0_0_40px_rgba(0,206,209,0.5)] transition-all flex items-center justify-center gap-2">
          ▶ GENEREAZĂ LINK 5 MINUTE
        </button>
      </div>

      <div id="resultBox" class="hidden mt-6 p-4 bg-emerald-900/30 border border-emerald-500/50 rounded-xl">
        <p class="text-emerald-400 text-sm font-bold mb-2">Link generat cu succes! Va expira în 5 minute.</p>
        <div class="flex gap-2">
          <input type="text" id="generatedUrl" readonly class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
          <a id="openBtn" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition-all whitespace-nowrap">
            Deschide Demo
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    function generateLink() {
      // 1. Get Image
      let imageUrl = document.querySelector('input[name="bgImage"]:checked').value;
      const customUrl = document.getElementById('customUrl').value;
      if (customUrl && customUrl.startsWith('http')) {
        imageUrl = customUrl;
      }

      // 2. Get Effect
      const effect = document.querySelector('input[name="effect"]:checked').value;

      // 3. Set expiration (now + 5 minutes)
      const expiresAt = Date.now() + (5 * 60 * 1000);

      // 4. Construct JSON payload
      const payload = {
        img: imageUrl,
        eff: effect,
        exp: expiresAt
      };

      // 5. Encode via Base64 to make it safely portable in URL
      const encodedPayload = btoa(JSON.stringify(payload));

      // 6. Build the final magic URL
      const baseUrl = window.location.href.split('/').slice(0, -1).join('/'); // Current folder
      const finalUrl = `${baseUrl}/demo_tv.html?d=${encodedPayload}`;

      // 7. Show user
      document.getElementById('generatedUrl').value = finalUrl;
      document.getElementById('openBtn').href = finalUrl;
      document.getElementById('resultBox').classList.remove('hidden');
    }
  </script>
</body>
</html>
