<!DOCTYPE html>
<html>
<head>
<style>
.container {
  width: 200px; /* Dashboard card width */
  margin: 50px auto;
  border: 2px solid green;
}
.vertical-preview {
  position: relative;
  background: black;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 auto;
  aspect-ratio: 9/16;
  width: 56.25%; /* 112.5px wide, 200px tall */
}
/* The iframe is 1080px wide internally. We need it to fit into 112.5px. Scale = 112.5 / 1080 = 0.10416 */
.iframe-content {
  position: absolute;
  top: 0;
  left: 0;
  width: 1080px;  /* Forcing inner layout width */
  height: 1920px;
  border: 0;
  transform: scale(0.104166);
  transform-origin: top left;
}
</style>
</head>
<body>
  <div class="container">
    <div class="vertical-preview">
       <iframe class="iframe-content" src="about:blank"></iframe>
    </div>
  </div>
</body>
</html>
