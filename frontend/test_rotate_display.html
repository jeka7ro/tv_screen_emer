<!DOCTYPE html>
<html>
<head>
<style>
.dashboard-card {
  width: 200px;
  background: #333;
  padding: 10px;
  margin: 50px auto;
}
.vertical-container {
  /* Dashboard card is vertical */
  position: relative;
  background: black;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 auto;
  aspect-ratio: 9/16;
  width: 56.25%; /* 112.5px wide, 200px tall */
}
.iframe-native {
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>
<body>
  <div class="dashboard-card">
    <div class="vertical-container">
       <iframe class="iframe-native" srcdoc="
          <html><body style='margin:0; padding:0; background: green;'>
             <div style='width:100%; height:100%; position:absolute; top:0; left:0; display:flex; align-items:center; justify-content:center; color:white;'>
                 100% PREVIEW
             </div>
          </body></html>
       "></iframe>
    </div>
  </div>
</body>
</html>
