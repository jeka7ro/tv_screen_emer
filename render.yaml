# Render – backend FastAPI (SushiMaster TV)
# Conectează repo-ul, setează env vars în Dashboard, apoi aplică Blueprint.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sushimaster-api
    runtime: python
    plan: free

    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
