# Render – backend FastAPI (SushiMaster TV) + Supabase Postgres
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sushimaster-api
    runtime: python
    plan: free

    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
